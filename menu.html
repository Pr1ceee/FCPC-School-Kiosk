<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>FCPC | Kiosk Menu</title>
        <link rel="stylesheet" href="Assets/CSS/menu.css">
        <script defer src="/Assets/JS/menu.js"></script>
    </head>
    <body>
        <!-- ============= LOADER ============= -->
        <div id="loader">Loading...</div>

        <!-- ============= BACK BUTTON ============= -->
        <button class="back-btn" onclick="location.href='index.html'">← Back</button>

        <!-- ============= MAIN CONTENT ============= -->
        <div class="container">
            <div class="grid">

                <!-- Cashier -->
                <button class="tile" onclick="location.href='cashier.html'">
                    <svg viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2">
                        <rect x="3" y="6" width="18" height="12"/>
                        <line x1="3" y1="10" x2="21" y2="10"/>
                    </svg>
                    <span>Cashier</span>
                </button>

                <!-- Registrar -->
                <button class="tile" onclick="location.href='registrar.html'">
                    <svg viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2">
                        <rect x="4" y="4" width="16" height="16"/>
                        <line x1="8" y1="8" x2="16" y2="8"/>
                        <line x1="8" y1="12" x2="16" y2="12"/>
                    </svg>
                    <span>Registrar</span>
                </button>

                <!-- Dean -->
                <button class="tile" onclick="location.href='dean.html'">
                    <svg viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2">
                        <path d="M12 3L2 9l10 6 10-6-10-6z"/>
                        <path d="M2 15l10 6 10-6"/>
                    </svg>
                    <span>Dean</span>
                </button>
            </div>
        </div>
    </body>
</html>
